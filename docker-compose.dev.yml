services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-verisi-dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: node --watch backend/src/index.js
    environment:
      MONGO_URL: mongodb://mongo:27017/compec
      PORT: "3001"
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app/backend
      - ./seed:/app/seed
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  mongo-verisi-dev:
