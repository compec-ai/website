server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Icerik API'si backend'e gider.
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Adi karma iceren yapim ciktilari uzun sure onbellege alinabilir.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Fontlar, gorseller ve stil dosyalari.
  location ~* \.(woff2|png|jpg|jpeg|svg|webp|css)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  # Tek sayfa uygulamasi: bilinmeyen yollar index.html'e duser, yonlendirmeyi React yapar.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
