# Yayin katmani. Tek basina degil, prod compose'un USTUNE binerek kullanilir:
#   docker compose -f docker-compose.yml -f docker-compose.yayin.yml up -d --build
# Fark: frontend /website oneki altinda derlenir ve yalnizca 127.0.0.1'e acilir
# (disari acan ana nginx'tir). Port YAYIN_PORT ile ezilebilir.
name: compec-yayin

services:
  backend:
    environment:
      # Olcum sekmesinin okuma anahtari. Yayin sunucusundaki .env dosyasinda
      # tutulur, depoya yazilmaz. Eksikse panel kurulum aciklamasini gosterir.
      POSTHOG_KISISEL_ANAHTAR: ${POSTHOG_KISISEL_ANAHTAR:-}
      POSTHOG_PROJE_ID: ${POSTHOG_PROJE_ID:-}

  frontend:
    build:
      args:
        TEMEL_YOL: /website
        # PostHog proje anahtari zaten tarayiciya gidiyor, gizli degil.
        # Yalniz yayin katmaninda tanimli: yerelde olcum kapali kalir.
        VITE_POSTHOG_KEY: ${POSTHOG_ANAHTAR:-phc_yYNh8yiQqmwFeTzxYiQ4UTvmoWAXi7wu8rHADbu6WxQJ}
    ports: !override
      - "127.0.0.1:${YAYIN_PORT:-8090}:80"
